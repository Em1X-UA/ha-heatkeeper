# HeatKeeper example: one section with global controls + one room card per room.
# Paste into a dashboard's raw configuration editor, or copy single cards.
# Room entity ids follow the room names Кухня/Вітальня/Офіс/Спальня.
title: Опалення
views:
  - title: Опалення
    path: heating
    icon: mdi:radiator
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Опалення
            icon: mdi:radiator
          - type: tile
            entity: select.heatkeeper_mode
            grid_options:
              columns: full
            features:
              - type: select-options
          - type: tile
            entity: sensor.heatkeeper_status
          - type: tile
            entity: switch.heatkeeper_presence
            features:
              - type: toggle
          - type: tile
            entity: switch.heatkeeper_boost
            features:
              - type: toggle
          - type: tile
            entity: button.heatkeeper_resume
            visibility:
              - condition: state
                entity: select.heatkeeper_mode
                state: tariff_outage
            tap_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.heatkeeper_resume

      - type: grid
        cards:
          - type: heading
            heading: Кімнати
            icon: mdi:home-thermometer
          - type: custom:heatkeeper-room-card
            entity: sensor.heatkeeper_kukhnia_zone_status
          - type: custom:heatkeeper-room-card
            entity: sensor.heatkeeper_vitalnia_zone_status
            show_presence: true
          - type: custom:heatkeeper-room-card
            entity: sensor.heatkeeper_ofis_zone_status
            show_presence: true
          - type: custom:heatkeeper-room-card
            entity: sensor.heatkeeper_spalnia_zone_status
            show_presence: true
